<agent_config>

  <agent_config>
  <syscheck merge="replace">
    <disabled>no</disabled>

    <!-- Przykładowe katalogi (OK) -->
    <directories realtime="yes" report_changes="yes">C:\Users\*\Desktop</directories>
    <directories realtime="no"  report_changes="yes">C:\Program Files</directories>
    <directories realtime="no"  report_changes="yes">C:\Program Files (x86)</directories>
    <directories realtime="no"  report_changes="yes">C:\Users\*\Downloads</directories>

    <!-- Rejestr Windows (BEZ 'realtime') -->
    <windows_registry report_changes="yes">
      HKEY_LOCAL_MACHINE\SOFTWARE
      HKEY_LOCAL_MACHINE\SYSTEM
      HKEY_LOCAL_MACHINE\SECURITY
      HKEY_CURRENT_USER\SOFTWARE
    </windows_registry>

    <!-- Ignore dla DPTF (żeby nie raportować .tmp) -->
    <ignore type="sregex">(?i)^c:\\windows\\system32\\drivers\\driverdata\\intel\\dptf\\dv\\dptf\.dv\.tmp$</ignore>

    <frequency>43200</frequency>
    <alert_new_files>no</alert_new_files>
    <skip_nfs>yes</skip_nfs><skip_dev>yes</skip_dev><skip_proc>yes</skip_proc><skip_sys>yes</skip_sys>
    
    <!-- Limit plikA3w -->
    <file_limit>
      <enabled>yes</enabled>
      <entries>200000</entries>
    </file_limit>

    <!-- WyA?Ä?cz alerty dla nowych plikA3w w haA?aA?liwych lokalizacjach -->
    <alert_new_files>no</alert_new_files>

    <!-- CzÄ?stotliwoA?Ä? peA?nego skanu -->
    <frequency>43200</frequency> <!-- 12 godzin -->

    <!-- Pomijanie katalogA3w systemowych -->
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>

    <!-- Priorytet procesu syscheck -->
    <process_priority>10</process_priority>

    <!-- Limit zdarzeA? na sekundÄ? -->
    <max_eps>50</max_eps>

    <!-- Synchronizacja bazy -->
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>

  </syscheck>

  <!-- WyA?Ä?cz SCA (opcjonalnie) -->
  <sca>
    <enabled>no</enabled>
  </sca>

</agent_config>
